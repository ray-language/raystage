<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Inspector</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 13px system-ui, sans-serif; background: Canvas; color: CanvasText; padding: 14px; }
  h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; margin: 0 0 10px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; } dt { opacity: .6; }
</style></head>
<body>
<h1>Inspector</h1>
<dl>
  <dt>kind</dt><dd>panel</dd>
  <dt>owner</dt><dd>the main window (follows it)</dd>
  <dt>always on top</dt><dd>yes</dd>
  <dt>minimizable</dt><dd>no</dd>
  <dt>position</dt><dd>set_position(40, 120)</dd>
</dl>
<p>Close it with the window's close button, or ⌘W.</p>
</body></html>
